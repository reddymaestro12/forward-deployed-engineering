[project]
name = "fde"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "venkateswara reddy", email = "reddymaestro12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "mypy>=2.4.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
fde = "fde:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]